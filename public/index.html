<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🍋 লেবু চোর - 3D Social Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <!-- ক্যানভাস কনফেটি -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<!-- গ্লোবাল ট্রল ব্যানার -->
<div id="globalAlert"></div>

<div class="container" id="mainApp">

  <!-- টপ বার: রুম ইনফো -->
  <div class="top-nav hidden" id="topNav">
    <div class="room-pill">রুম কোড: <span id="codeBadge">----</span></div>
    <div style="font-size: 13px; color: #94a3b8;">🍋 লেবু চোর অ্যারিনা</div>
  </div>

  <!-- লাইভ লিডারবোর্ড টেবিল -->
  <div class="glass-panel hidden" id="topScoreboardCard">
    <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
      <span style="font-weight:bold; color:var(--lemon); font-size:15px;">🏆 লাইভ লিডারবোর্ড</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>প্লেয়ার</th>
          <th>পয়েন্ট</th>
          <th>বর্তমান অবস্থা</th>
        </tr>
      </thead>
      <tbody id="scoreTableBody"></tbody>
    </table>
  </div>

  <!-- ১. হোম স্ক্রিন -->
  <div class="glass-panel" id="homeScreen">
    <div style="font-size: 50px; margin-bottom: 6px;">🍋</div>
    <h1 style="color:var(--lemon); font-size:32px; font-weight:800; text-shadow: 0 0 20px var(--glow);">লেবু চোর</h1>
    <p style="color:#94a3b8; font-size:14px; margin-bottom:16px;">কে চোর, আর কে দিল ইশারা? রহস্যভেদের আসল আড্ডা!</p>
    
    <input type="text" id="playerName" placeholder="আপনার নাম লিখুন..." maxlength="12">
    <button class="btn-3d btn-primary" onclick="createRoom()">নতুন রুম তৈরি করুন (Host)</button>
    
    <div style="margin: 12px 0; color:#64748b; font-size:13px;">— অথবা কোড দিয়ে যোগ দিন —</div>
    
    <input type="text" id="roomCodeInput" placeholder="৪ অক্ষরের রুম কোড..." style="text-transform: uppercase;" maxlength="4">
    <button class="btn-3d btn-secondary" onclick="joinRoom()">রুমে প্রবেশ করুন</button>
  </div>

  <!-- ২. মূল এরিনা বোর্ড -->
  <div class="glass-panel hidden" id="gameArenaScreen">
    
    <!-- সার্কুলার এরিনা -->
    <div class="arena-circle" id="arenaCircle">
      <svg id="laserSvg" class="laser-layer"></svg>
      <div class="center-wheel" id="centerWheel">🍋</div>
    </div>

    <!-- ১৫ সেকেন্ডের টাইমার -->
    <div id="turnTimer" class="timer-badge hidden">⏳ <span id="timerSeconds">15</span>s</div>

    <!-- ইশারা নোটিস -->
    <div id="gestureReceivedBox" style="background:rgba(250,204,21,0.2); border:2px solid var(--lemon); color:var(--lemon); padding:10px; border-radius:12px; font-weight:bold; margin-bottom:10px;" class="hidden"></div>

    <!-- স্ট্যাটাস টেক্সট -->
    <div id="statusInstruction" style="font-size:15px; font-weight:bold; min-height:38px; color:var(--accent);">
      লবিতে অপেক্ষা করা হচ্ছে...
    </div>

    <!-- অ্যাকশন কন্ট্রোলস -->
    <div id="actionArea">
      <button id="startGameBtn" class="btn-3d btn-primary hidden" onclick="startGame()">গেম শুরু করুন (হুইল ঘোরান) 🚀</button>
      
      <button id="claimGestureBtn" class="btn-3d btn-warning hidden" onclick="claimGesture()">
        👉 আমি ইশারা পেয়েছি!
      </button>

      <div id="selectionBox" class="hidden" style="background:#0b1120; border:1px solid var(--accent); border-radius:14px; padding:12px; margin-top:10px;">
        <div id="selectionTitle" style="color:var(--lemon); font-weight:bold; margin-bottom:8px; font-size:14px;"></div>
        <div id="selectionButtons" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
    </div>
  </div>

  <!-- ৩. ম্যাচ ওভার ফাইনাল ট্রফি স্ক্রিন -->
  <div class="glass-panel hidden" id="matchEndedScreen">
    <div style="font-size: 60px; margin-bottom: 8px;">🏆</div>
    <h1 style="color:var(--lemon); font-size:30px; margin-bottom:10px;">খেলা সমাপ্ত!</h1>
    <div id="winnerPodium" style="margin: 18px 0;"></div>
    <button class="btn-3d btn-primary" onclick="location.reload()">হোমে ফিরে যান</button>
  </div>

  <!-- ফ্লোটিং ইমোজি ডক -->
  <div class="emoji-dock hidden" id="emojiDock">
    <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
    <button class="emoji-btn" onclick="sendEmoji('🍋')">🍋</button>
    <button class="emoji-btn" onclick="sendEmoji('🕵️')">🕵️</button>
    <button class="emoji-btn" onclick="sendEmoji('🤫')">🤫</button>
    <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
